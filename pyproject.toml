[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-coupled-nas"
version = "0.1.0"
readme = "README.md"
description = "Risk-Coupled-NAS implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["risknas*"]

[project.optional-dependencies]
training = ["torch>=2.2", "torchvision>=0.17"]
